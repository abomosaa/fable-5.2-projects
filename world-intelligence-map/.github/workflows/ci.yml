name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The only network use in CI: installing dependencies and the test browser. Tests themselves run offline, without secrets.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
