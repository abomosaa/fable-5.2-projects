[versions]
agp = "8.13.2"
kotlin = "2.2.10"
composeBom = "2025.09.00"
activity = "1.11.0"
navigation = "2.9.4"
lifecycle = "2.9.3"
camerax = "1.5.0"
work = "2.10.4"
arcore = "1.50.0"
okhttp = "4.12.0"
serialization = "1.9.0"
coroutines = "1.10.2"
zxing = "3.5.3"
exif = "1.4.1"
coreKtx = "1.17.0"
junit = "4.13.2"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
