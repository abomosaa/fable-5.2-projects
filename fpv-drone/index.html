<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPV Sim - physically based FPV drone simulator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101418'/%3E%3Cg stroke='%23e8591c' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M9 9l14 14M23 9L9 23'/%3E%3C/g%3E%3Cg fill='none' stroke='%239fe8ff' stroke-width='1.6'%3E%3Ccircle cx='8' cy='8' r='4.5'/%3E%3Ccircle cx='24' cy='8' r='4.5'/%3E%3Ccircle cx='8' cy='24' r='4.5'/%3E%3Ccircle cx='24' cy='24' r='4.5'/%3E%3C/g%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: rgba(14, 17, 21, 0.88);
        --panel: rgba(255, 255, 255, 0.045);
        --line: rgba(255, 255, 255, 0.1);
        --text: #e9edf1;
        --dim: #97a3ae;
        --accent: #ff6a2b;
        --accent2: #7fdcff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: #0b0d10; color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      }
      canvas#view, canvas#osd { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      canvas#osd { pointer-events: none; }
      canvas#view { outline: none; }
      #telemetry {
        position: fixed; left: 3.5vw; top: 26vh; padding: 10px 12px; background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--line); border-radius: 6px; white-space: pre; pointer-events: none;
        font: 12px/1.45 ui-monospace, 'DejaVu Sans Mono', Menlo, Consolas, monospace; color: #dfe6ec; display: none;
      }
      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
        gap: 14px; background: #0b0d10; z-index: 50; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-size: 12px;
      }
      #loading b { color: var(--text); font-size: 22px; letter-spacing: 0.22em; }
      #menu {
        position: fixed; inset: 0; display: none; z-index: 20; background: rgba(5, 7, 9, 0.55);
        backdrop-filter: blur(7px); -webkit-backdrop-filter: blur(7px);
        align-items: center; justify-content: center; padding: 3vh 3vw;
      }
      #menu.open { display: flex; }
      .window {
        width: min(1040px, 100%); height: min(720px, 100%); display: grid; grid-template-columns: 210px 1fr;
        background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .side { border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 22px 14px 14px; gap: 4px; }
      .brand { font-weight: 800; font-size: 20px; letter-spacing: 0.2em; padding: 0 8px; }
      .brand span { color: var(--accent); }
      .tagline { color: var(--dim); font-size: 11.5px; padding: 2px 8px 18px; line-height: 1.35; }
      .tab {
        all: unset; cursor: pointer; padding: 9px 12px; border-radius: 7px; color: var(--dim); font-weight: 600; font-size: 13.5px;
      }
      .tab:hover { color: var(--text); background: var(--panel); }
      .tab.active { color: var(--text); background: rgba(255, 106, 43, 0.16); box-shadow: inset 2px 0 0 var(--accent); }
      .tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
      .side .spacer { flex: 1; }
      .btn {
        all: unset; cursor: pointer; text-align: center; padding: 10px 14px; border-radius: 8px; font-weight: 700;
        background: var(--panel); border: 1px solid var(--line); font-size: 13.5px;
      }
      .btn:hover { background: rgba(255, 255, 255, 0.09); }
      .btn.primary { background: var(--accent); border-color: transparent; color: #140700; }
      .btn.primary:hover { background: #ff7f47; }
      .btn.small { padding: 5px 10px; font-size: 12px; font-weight: 600; }
      .btn.busy { background: rgba(127, 220, 255, 0.18); border-color: var(--accent2); }
      .content { overflow-y: auto; padding: 24px 28px 28px; }
      .content h2 { margin: 0 0 4px; font-size: 19px; }
      .content h3 { margin: 22px 0 8px; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
      .content p { color: var(--dim); margin: 6px 0 12px; max-width: 70ch; }
      .content p b, .content li b { color: var(--text); }
      .row { display: grid; grid-template-columns: 190px 1fr 86px; align-items: center; gap: 12px; padding: 6px 0; }
      .row label { color: var(--text); }
      .row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent2); font-size: 13px; }
      .row .hint { grid-column: 2 / 4; color: var(--dim); font-size: 12px; margin-top: -4px; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      select, input[type='number'] {
        width: 100%; padding: 7px 9px; border-radius: 7px; background: #171b20; color: var(--text); border: 1px solid var(--line); font: inherit;
      }
      input[type='checkbox'] { width: 17px; height: 17px; accent-color: var(--accent); }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; margin: 8px 0; }
      .card .k { color: var(--dim); }
      .specs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 2px; }
      .spec { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
      .spec b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
      .spec span { color: var(--dim); font-size: 11.5px; }
      .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
      table.map { width: 100%; border-collapse: collapse; }
      table.map td, table.map th { padding: 5px 6px; text-align: left; font-weight: 500; }
      table.map th { color: var(--dim); font-size: 12px; }
      .bar { position: relative; height: 12px; background: #171b20; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; min-width: 120px; }
      .bar i { position: absolute; top: 0; bottom: 0; width: 3px; background: var(--accent2); left: 50%; transform: translateX(-50%); }
      .bar::after { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--line); }
      .rawaxes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 12px; font-size: 12px; color: var(--dim); }
      kbd {
        display: inline-block; min-width: 22px; text-align: center; padding: 1px 6px; border-radius: 5px; background: #20262d;
        border: 1px solid var(--line); border-bottom-width: 2px; font: 12px ui-monospace, Menlo, Consolas, monospace; color: var(--text);
      }
      .keys { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; align-items: center; }
      .keys span { color: var(--dim); }
      .note { border-left: 3px solid var(--accent); padding: 8px 12px; background: rgba(255, 106, 43, 0.07); border-radius: 0 8px 8px 0; color: var(--text); margin: 12px 0; }
      canvas.plot { width: 100%; height: 150px; background: #12161a; border: 1px solid var(--line); border-radius: 8px; }
      @media (max-width: 760px) {
        .window { grid-template-columns: 1fr; height: 100%; }
        .side { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; }
        .brand, .tagline, .side .spacer { display: none; }
        .row { grid-template-columns: 1fr 1fr 70px; }
        .specs { grid-template-columns: repeat(2, 1fr); }
      }
    </style>
  </head>
  <body>
    <canvas id="view" tabindex="-1"></canvas>
    <canvas id="osd"></canvas>
    <div id="telemetry"></div>
    <div id="menu"></div>
    <div id="loading"><b>FPV SIM</b>building the flying field...</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
