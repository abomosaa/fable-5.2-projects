[package]
name = "cutline-server"
description = "Cutline video editor: HTTP server, media pipeline, Soniox integration and FFmpeg renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "cutline"

[lib]
name = "cutline_server"
path = "src/lib.rs"

[[bin]]
name = "cutline"
path = "src/main.rs"

[dependencies]
cutline-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
axum = { version = "0.8", features = ["multipart", "macros"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "set-header"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"
anyhow = "1"
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
