org.gradle.jvmargs=-Xmx2400m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The build host used for this project caps the session at ~6 GB RAM: keep Gradle/Kotlin lean.
# Compile Kotlin inside the Gradle daemon: one JVM instead of two.
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=4
# Release the daemon's memory quickly: this host shares one memory budget between builds, emulator and reconstruction.
org.gradle.daemon.idletimeout=30000
